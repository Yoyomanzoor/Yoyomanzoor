project:
  type: website
  output-dir: docs

shortcodes:
  - github.lua

website:
  title: "Yoyomanzoor"
  description: "Yoyomanzoor's personal site"
  site-url: "https://yoyomanzoor.github.io/Yoyo"
  search: true
  favicon: "images/yoyo.png"
  navbar:
    left:
      - icon: house
        href: index.qmd
        text: "<span></span>"
        aria-label: Home
      - icon: person
        href: about.qmd
        text: "<span></span>"
        aria-label: About
      - icon: journal-text
        href: blog.qmd
        text: "<span></span>"
        aria-label: Blog
      - icon: feather
        href: poetry/index.qmd
        text: "<span></span>"
        aria-label: Poetry
    right:
      - icon: github
        href: https://github.com/Yoyomanzoor

format:
  html:
    theme:
      light: [flatly, shared.scss, flatly-custom.scss]
      dark: [darkly, shared.scss, darkly-custom.scss]
    toc: true
    html-math-method: mathjax
    fig-align: center
